[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tubewalk"
version = "0.1.0"
description = "Ground, section diameter, LAS, and a LAZ chunk table. Not the points inside a .laz file."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Digital Currensy Inc." }]
dependencies = ["laspy", "lazrs"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tubewalk = "tubewalk.__main__:main"
